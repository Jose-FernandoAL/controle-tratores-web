{% extends "base.html" %}

{% block title %}Novo pedido | Tragis{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <div>
        <h1 class="fw-bold text-marrom mb-1">Novo pedido</h1>
        <p class="text-muted mb-0">Cadastre um novo pedido de uso de maquinário.</p>
    </div>

    <a href="{{ url_for('listar_pedidos_rota') }}" class="btn btn-outline-secondary">
        Cancelar
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
        <form method="post" class="row g-3">

            <div class="col-12 col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" name="nome_agricultor" class="form-control" required>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" class="form-control" required>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Serviço</label>
                <select name="servico" class="form-select" required>
                    <option value="">Selecione um serviço</option>
                    {% for servico in servicos | default(["Arar terra", "Puxar carga", "Moer silagem"]) %}
                        <option value="{{ servico }}">{{ servico }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Local</label>
                <input type="text" name="local" class="form-control" required>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Duração em horas</label>
                <input type="number" name="duracao_horas" min="1" class="form-control" placeholder="Ex: 3">
            </div>

            <div class="col-12 col-md-6 d-flex align-items-end">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="tempo_indefinido" id="tempo_indefinido">
                    <label class="form-check-label" for="tempo_indefinido">
                        Tempo indefinido
                    </label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label">Observações</label>
                <textarea name="observacoes" rows="4" class="form-control"></textarea>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    Cadastrar pedido
                </button>

                <a href="{{ url_for('listar_pedidos_rota') }}" class="btn btn-outline-secondary">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

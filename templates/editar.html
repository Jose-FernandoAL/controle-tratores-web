{% extends "base.html" %}

{% block title %}Editar pedido | Tragis{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <div>
        <h1 class="fw-bold text-marrom mb-1">Editar pedido</h1>
        <p class="text-muted mb-0">Atualize as informações do pedido.</p>
    </div>

    <a href="{{ url_for('listar_pedidos_rota') }}" class="btn btn-outline-secondary">
        Cancelar
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
        <form method="post" class="row g-3">

            <div class="col-12 col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" name="nome_agricultor" value="{{ pedido.nome_agricultor }}" class="form-control" required>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" value="{{ pedido.telefone }}" class="form-control" required>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Serviço</label>
                <select name="servico" class="form-select" required>
                    {% for servico in servicos | default(["Arar terra", "Puxar carga", "Moer silagem"]) %}
                        <option value="{{ servico }}" {{ "selected" if pedido.servico == servico else "" }}>
                            {{ servico }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Local</label>
                <input type="text" name="local" value="{{ pedido.local }}" class="form-control" required>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Duração em horas</label>
                <input type="number" name="duracao_horas" min="1" value="{{ pedido.duracao_horas or '' }}" class="form-control">
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Data marcada</label>
                <input type="date" name="data_marcada" value="{{ pedido.data_marcada or '' }}" class="form-control">
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Hora início</label>
                <input type="time" name="hora_inicio" value="{{ (pedido.hora_inicio or '')[:5] }}" class="form-control">
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Hora fim</label>
                <input type="text" value="{{ (pedido.hora_fim or '')[:5] }}" class="form-control" disabled>
                <small class="text-muted">A hora final é calculada automaticamente pela duração.</small>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for status_opcao in ["Pendente", "Agendado", "Em andamento", "Concluído", "Cancelado"] %}
                        <option value="{{ status_opcao }}" {{ "selected" if pedido.status == status_opcao else "" }}>
                            {{ status_opcao }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <label class="form-label">Observações</label>
                <textarea name="observacoes" rows="4" class="form-control">{{ pedido.observacoes or "" }}</textarea>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    Salvar alterações
                </button>

                <a href="{{ url_for('listar_pedidos_rota') }}" class="btn btn-outline-secondary">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
